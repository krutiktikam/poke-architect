name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging PokéArchitect Health Endpoint..."
          curl -f -s https://poke-architect.onrender.com/api/health || echo "Ping attempted"
