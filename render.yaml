services:
  - type: web
    name: poke-architect-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic -c backend/alembic.ini upgrade head && gunicorn -w 1 -k uvicorn.workers.UvicornWorker backend.main:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.0
